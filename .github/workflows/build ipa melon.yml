name: Build Unsigned IPA (iOS 26 / Liquid Glass)
 
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build:
    name: Build MeloNX Unsigned IPA
    runs-on: macos-26
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
 
      - name: Verify Xcode version
        run: xcodebuild -version
 
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
 
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
 
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.xcworkspace', '**/*.xcodeproj', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-
 
      - name: Run compile script
        run: |
          SCRIPT=""
          if   [ -f ".compile/compile.sh" ]; then SCRIPT=".compile/compile.sh"
          elif [ -f "compile.sh" ];           then SCRIPT="compile.sh"
          fi
          if [ -n "$SCRIPT" ]; then
            chmod +x "$SCRIPT"
            bash "$SCRIPT"
          else
            echo "No compile.sh found"
          fi
 
      - name: Detect workspace and scheme
        id: detect
        run: |
          WORKSPACE=$(find . -maxdepth 4 -name "*.xcworkspace" \
            ! -path "*/DerivedData/*" ! -path "*/.build/*" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found!"
            exit 1
          fi
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "Workspace: $WORKSPACE"
 
          SCHEMES=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | \
            awk '/Schemes:/,0' | tail -n +2 | sed 's/^[[:space:]]*//' | grep -v '^$')
          echo "All schemes:"
          echo "$SCHEMES"
 
          # 1. Exact match "MeloNX"
          SCHEME=$(echo "$SCHEMES" | grep -x "MeloNX" | head -1)
          # 2. Short name khong co dau cham (com.xxx)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | grep -i "melonx" | grep -v '\.' | head -1)
          # 3. Fallback bat ky scheme nao chua MeloNX
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | grep -i "melonx" | head -1)
          # 4. Fallback scheme dau tien
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | head -1)
 
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Selected scheme: $SCHEME"
 
      - name: Build unsigned archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
 
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme    "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/MeloNX.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH="/Applications" \
            clean archive 2>&1 | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"
 
          echo "--- Archive contents ---"
          find "$GITHUB_WORKSPACE/build/MeloNX.xcarchive" | head -60
 
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.sha }}
          path: ${{ github.workspace }}/build/xcodebuild.log
          retention-days: 7
 
      - name: Package IPA
        run: |
          ARCHIVE="$GITHUB_WORKSPACE/build/MeloNX.xcarchive"
          PAYLOAD="$GITHUB_WORKSPACE/build/Payload"
 
          mkdir -p "$PAYLOAD"
 
          # Tim .app trong archive, bo qua dSYMs
          APP=$(find "$ARCHIVE" -name "*.app" -not -path "*/dSYMs/*" | head -1)
 
          # Neu khong co trong archive, tim trong DerivedData (Xcode 26 fallback)
          if [ -z "$APP" ]; then
            echo "Not found in archive, searching DerivedData..."
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" \
              -path "*/Release-iphoneos/*" \
              -not -path "*/dSYMs/*" \
              -not -name "*.appex" \
              2>/dev/null | head -1)
          fi
 
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found anywhere!"
            exit 1
          fi
          echo "App: $APP"
 
          cp -R "$APP" "$PAYLOAD/"
          cd "$GITHUB_WORKSPACE/build"
          zip -r "MeloNX-unsigned.ipa" "Payload" -x "*.DS_Store"
          echo "IPA size: $(du -sh MeloNX-unsigned.ipa | cut -f1)"
 
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-unsigned-${{ github.sha }}
          path: ${{ github.workspace }}/build/MeloNX-unsigned.ipa
          retention-days: 30
