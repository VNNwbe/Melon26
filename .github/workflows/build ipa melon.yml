name: Build Unsigned IPA (iOS 26 / Liquid Glass)
 
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build:
    name: Build MeloNX Unsigned IPA
    runs-on: macos-26
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
 
      - name: Verify Xcode version
        run: xcodebuild -version
 
      # Dung .NET 8 vi project dung net8.0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
 
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
 
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.xcworkspace', '**/*.xcodeproj', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-
 
      # Buoc quan trong: build C# native library truoc
      - name: Build Ryujinx .NET native libraries
        run: |
          echo "=== Checking compile scripts ==="
          find . -name "compile.sh" | head -5
 
          # Chay compile.sh neu co
          SCRIPT=""
          if   [ -f ".compile/compile.sh" ]; then SCRIPT=".compile/compile.sh"
          elif [ -f "compile.sh" ];           then SCRIPT="compile.sh"
          fi
 
          if [ -n "$SCRIPT" ]; then
            echo "Running $SCRIPT"
            chmod +x "$SCRIPT"
            bash "$SCRIPT"
          else
            echo "No compile.sh — building Ryujinx.Headless.SDL2 manually..."
 
            # Tim file .csproj cua Ryujinx.Headless.SDL2
            CSPROJ=$(find . -name "Ryujinx.Headless.SDL2.csproj" | head -1)
            if [ -z "$CSPROJ" ]; then
              echo "ERROR: Khong tim thay Ryujinx.Headless.SDL2.csproj!"
              find . -name "*.csproj" | head -10
              exit 1
            fi
            echo "Found: $CSPROJ"
 
            # Build native dylib cho ios-arm64
            dotnet publish "$CSPROJ" \
              -c Release \
              -r ios-arm64 \
              --self-contained true \
              -p:PublishAot=true \
              || dotnet build "$CSPROJ" \
                   -c Release \
                   -r ios-arm64 \
                   --self-contained true
 
            # Kiem tra ket qua
            echo "=== Built dylibs ==="
            find . -name "*.dylib" | head -20
            find . -name "*.framework" | head -10
          fi
 
          # Xac nhan dylib ton tai
          DYLIB=$(find . -name "Ryujinx.Headless.SDL2.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "ERROR: Ryujinx.Headless.SDL2.dylib chua duoc build!"
            exit 1
          fi
          echo "OK: $DYLIB ($(du -sh "$DYLIB" | cut -f1))"
 
      - name: Detect workspace and scheme
        id: detect
        run: |
          WORKSPACE=$(find . -maxdepth 4 -name "*.xcworkspace" \
            ! -path "*/DerivedData/*" ! -path "*/.build/*" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found!"
            exit 1
          fi
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "Workspace: $WORKSPACE"
 
          SCHEMES=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | \
            awk '/Schemes:/,0' | tail -n +2 | sed 's/^[[:space:]]*//' | grep -v '^$')
          echo "All schemes:"
          echo "$SCHEMES"
 
          # Exact match "MeloNX" truoc
          SCHEME=$(echo "$SCHEMES" | grep -x "MeloNX" | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | grep -i "melonx" | grep -v '\.' | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | grep -i "melonx" | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | head -1)
 
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Selected scheme: [$SCHEME]"
 
      - name: Build unsigned archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
 
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme    "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/MeloNX.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH="/Applications" \
            clean archive 2>&1 | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"
 
          echo "--- Archive contents ---"
          find "$GITHUB_WORKSPACE/build/MeloNX.xcarchive" | head -60
 
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.sha }}
          path: ${{ github.workspace }}/build/xcodebuild.log
          retention-days: 7
 
      - name: Package IPA
        run: |
          ARCHIVE="$GITHUB_WORKSPACE/build/MeloNX.xcarchive"
          PAYLOAD="$GITHUB_WORKSPACE/build/Payload"
          mkdir -p "$PAYLOAD"
 
          # Tim .app trong archive
          APP=$(find "$ARCHIVE" -name "*.app" -not -path "*/dSYMs/*" | head -1)
 
          # Fallback: tim trong DerivedData
          if [ -z "$APP" ]; then
            echo "Not in archive, searching DerivedData..."
            APP=$(find ~/Library/Developer/Xcode/DerivedData \
              -name "MeloNX.app" \
              -path "*/Release-iphoneos/*" \
              -not -path "*/dSYMs/*" \
              2>/dev/null | head -1)
          fi
 
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
 
          SIZE_KB=$(du -sk "$APP" | cut -f1)
          echo "App: $APP (${SIZE_KB}KB)"
 
          if [ "$SIZE_KB" -lt 1000 ]; then
            echo "ERROR: .app qua nho (${SIZE_KB}KB) — co the thieu dylib!"
            ls -la "$APP/"
            exit 1
          fi
 
          cp -R "$APP" "$PAYLOAD/"
          cd "$GITHUB_WORKSPACE/build"
          zip -r "MeloNX-unsigned.ipa" "Payload" -x "*.DS_Store"
          echo "IPA size: $(du -sh MeloNX-unsigned.ipa | cut -f1)"
 
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-unsigned-${{ github.sha }}
          path: ${{ github.workspace }}/build/MeloNX-unsigned.ipa
          retention-days: 30
